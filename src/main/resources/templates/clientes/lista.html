<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Lista de Clientes</title>
</head>

<body>
    <div th:fragment="content" class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-4">
                Clientes
            </h1>
            <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasAuthority('CLIENT_CREATE')">
                Novo Cliente
            </a>
        </div>

        <!-- Mensagens de feedback -->
        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <!-- Tabela de clientes -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                            <th style="width: 15%;" class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-tabela">
                        <tr th:unless="@{#lists.isEmpty(clientes)}">
                            <td colspan="4" class="text-center text-muted py-4">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.nome()}"></td>
                            <td th:text="${cliente.telefone()}"></td>
                            <td th:text="${cliente.endereco()}"></td>
                            <td class="text-end d-flex justify-content-around">
                                <a th:href="@{/clientes/editar/{id}(id=${cliente.id()})}"
                                    class="btn btn-warning btn-sm"
                                    sec:authorize="hasAuthority('CLIENT_UPDATE')" >
                                    Editar
                                </a>
                                <form th:action="@{/clientes/deletar/{id}(id=${cliente.id()})}" method="post"
                                    th:onsubmit="'return confirm(\'Deseja excluir o cliente\')'">
                                    <button class="btn btn-danger btn-sm" type="submit" sec:authorize="hasAuthority('CLIENT_DELETE')">
                                        Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
