<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

    <div th:fragment="content" class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-4">Gestão de Produtos</h1>
    
            <!-- Botão para abrir o formulário -->
            <a th:href="@{/produtos/novo}" sec:authorize="hasRole('GERENTE')" class="btn btn-primary mb-3">
                Novo Produto
            </a>
        </div>

        <!-- Mensagens de feedback -->
        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <!-- Listagem de Produtos -->
        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th style="width: 20%;">ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Preço</th>
                    <th style="width: 5%;">Ativo</th>
                    <th style="width: 15%;" sec:authorize="hasRole('GERENTE')">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="6" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum produto cadastrado.
                    </td>
                </tr>
                <!-- Loop para listar os produtos -->
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.tipo}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                    <td sec:authorize="hasRole('GERENTE')" class="d-flex gap-1 justify-content-around">
                        <a 
                            th:href="@{/produtos/editar/{id}(id=${produto.id})}" 
                            style="min-width: 40%;" 
                            class="btn btn-warning btn-sm">
                            Editar
                        </a>
                        <form method="post" 
                            onsubmit="return confirm('Tem certeza que deseja excluir este produto?');" 
                            th:action="@{/produtos/deletar/{id}(id=${produto.id})}"
                            class="d-inline">
                            
                            <button type="submit" style="min-width: 40%;" class="btn btn-danger btn-sm">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
