<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Novo Pedido</title>
</head>

<body>
    <div th:fragment="content" class="container">

        <div class="d-flex flex-row align-items-center gap-3 mb-4">
            <a th:href="@{/pedidos}"><i class="bi text-muted bi-arrow-left"></i></a>
            <h1 class="mb-2">
                Cadastrar Pedido
            </h1>
        </div>

        <form th:action="@{/pedidos}" th:object="${pedido}" method="post" id="formPedido">
            <input type="hidden" name="usuarioId" th:value="${usuario.id}" />

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="h5 mb-3 text-dark fw-bold">Informações do Pedido</h3>
                    <div class="mb-3">
                        <label for="cliente" class="form-label fw-bold">Cliente</label>
                        <select th:field="*{clienteId}" id="cliente" name="cliente" class="form-select" required>
                            <option value="" selected disabled>Selecione o Cliente</option>
                            <th:block th:each="cliente : ${clientes}">
                                <option th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                            </th:block>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="h5 mb-3 text-dark fw-bold">Produtos do Pedido</h3>
                </div>
                <div class="card-body p-0" id="container-itens">
                    <div class="item-row p-3 border-bottom" data-index="0">
                        <label class="form-label fw-bold small text-muted">Produto 1</label>
                        <div class="d-flex gap-3 align-items-center flex-wrap">
                            <select name="itens[0].produtoId" class="form-select produto-select" style="flex: 2;" required onchange="atualizarValores(this)">
                                <option value="" selected disabled>Selecione um Produto</option>
                                <th:block th:each="produto : ${produtos}">
                                    <option th:value="${produto.id}" th:text="${produto.nome}" th:data-preco="${produto.preco}"></option>
                                </th:block>
                            </select>

                            <input type="number" name="itens[0].quantidade" value="1" min="1" class="form-control qtd-input" style="width: 15%;" required oninput="atualizarValores(this)" />

                            <div style="width: 15%;">
                                <span class="text-muted small d-block">Preço Unit.</span>
                                <strong class="preco-unitario">R$ 0,00</strong>
                            </div>

                            <div style="width: 15%;">
                                <span class="text-muted small d-block">Subtotal</span>
                                <strong class="subtotal">R$ 0,00</strong>
                            </div>

                            <button class="btn btn-danger btn-sm" type="button" onclick="removerItem(this)">Remover</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="adicionarItem()">Adicionar Item</button>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <div class="fs-5 fw-bold">
                        Total: <span id="valorTotalGeral">R$ 0,00</span>
                    </div>
                    <button class="btn btn-primary" type="submit">Cadastrar Pedido</button>
                </div>
            </div>

        </form>

        <script th:inline="javascript">
            const produtosDisponiveis = /*[[${produtos}]]*/[];

            let itemIndex = 0;

            function adicionarItem() {
                itemIndex++;
                const container = document.getElementById('container-itens');

                let opcoesHtml = '<option value="" selected disabled>Selecione um Produto</option>';
                produtosDisponiveis.forEach(produto => {
                    opcoesHtml += `<option value="${produto.id}" data-preco="${produto.preco}">${produto.nome}</option>`;
                });

                const novaLinha = document.createElement('div');
                novaLinha.className = 'item-row p-3 border-bottom';
                novaLinha.setAttribute('data-index', itemIndex);

                novaLinha.innerHTML = `
                    <label class="form-label fw-bold small text-muted">Produto ${itemIndex + 1}</label>
                    <div class="d-flex gap-3 align-items-center flex-wrap">
                        <select name="itens[${itemIndex}].produtoId" class="form-select produto-select" style="flex: 2;" required onchange="atualizarValores(this)">
                            ${opcoesHtml}
                        </select>

                        <input type="number" name="itens[${itemIndex}].quantidade" value="1" min="1" class="form-control qtd-input" style="width: 15%;" required oninput="atualizarValores(this)" />

                        <div style="width: 15%;">
                            <span class="text-muted small d-block">Preço Unit.</span>
                            <strong class="preco-unitario">R$ 0,00</strong>
                        </div>

                        <div style="width: 15%;">
                            <span class="text-muted small d-block">Subtotal</span>
                            <strong class="subtotal">R$ 0,00</strong>
                        </div>

                        <button class="btn btn-danger btn-sm" type="button" onclick="removerItem(this)">Remover</button>
                    </div>
                `;

                container.appendChild(novaLinha);
            }

            function removerItem(botao) {
                const linhas = document.querySelectorAll('.item-row');
                if (linhas.length > 1) {
                    botao.closest('.item-row').remove();
                    reindexarItens();
                    calcularTotalGeral();
                } else {
                    alert("O pedido precisa ter pelo menos um item.");
                }
            }

            function reindexarItens() {
                const linhas = document.querySelectorAll('.item-row');
                linhas.forEach((linha, index) => { 
                    const label = linha.querySelector('.form-label');
                    if (label) label.textContent = `Produto ${index + 1}`;

                    const selectProduto = linha.querySelector('select');
                    const inputQtd = linha.querySelector('input[type="number"]');

                    if (selectProduto) selectProduto.name = `itens[${index}].produtoId`;
                    if (inputQtd) inputQtd.name = `itens[${index}].quantidade`;
                });
                itemIndex = linhas.length - 1;
            }

            function atualizarValores(elemento) {
                const linha = elemento.closest('.item-row');
                const select = linha.querySelector('.produto-select');
                const inputQtd = linha.querySelector('.qtd-input');
                const spanPrecoUnitario = linha.querySelector('.preco-unitario');
                const spanSubtotal = linha.querySelector('.subtotal');

                const optionSelecionada = select.options[select.selectedIndex];
                const precoUnitario = optionSelecionada ? parseFloat(optionSelecionada.getAttribute('data-preco')) || 0 : 0;
                const quantidade = parseInt(inputQtd.value) || 0;

                const subtotal = precoUnitario * quantidade;

                spanPrecoUnitario.textContent = precoUnitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                spanSubtotal.textContent = subtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                calcularTotalGeral();
            }

            function calcularTotalGeral() {
                const subtotais = document.querySelectorAll('.subtotal');
                let totalGeral = 0;

                subtotais.forEach(span => {
                    const valorLimpo = span.textContent
                        .replace('R$', '')
                        .replace(/\./g, '')
                        .replace(',', '.')
                        .trim();
                    
                    totalGeral += parseFloat(valorLimpo) || 0;
                });

                document.getElementById('valorTotalGeral').textContent = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }
        </script>
    </div>
</body>

</html>
