<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Lista de Pedidos</title>
</head>

<body>

    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-4">
                Pedidos
            </h1>
            <a sec:authorize="hasAuthority('ORDER_CREATE')" th:href="@{/pedidos/novo}" class="btn btn-primary">
                Novo Pedido
            </a>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Cliente</th>
                            <th>Horario</th>
                            <th>Atendente</th>
                            <th>Estado</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum pedido encontrado.
                            </td>
                        </tr>

                        <tr th:each="pedido : ${pedidos}">
                            <td class="ps-4 text-muted" th:text="${pedido.id.substring(0, pedido.id.indexOf('-'))}"></td>
                            <td th:text="${pedido.clienteNome}"></td>
                            <td th:text="${#temporals.format(pedido.horario, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${pedido.usuarioNome}"></td>
                            <td>
                                <span class="badge"
                                    th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                    th:text="${pedido.status}">
                                </span>
                            </td>
                            <td>
                                <a sec:authorize="hasAuthority('ORDER_READ')" th:href="@{/pedidos/exibir/{id}(id=${pedido.id})}" class="btn btn-success btn-sm">
                                    Exibir
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
                Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
            </div>
        </div>

    </div>

</body>

</html>
