spring.config.import=optional:file:.env.test[.properties]

# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.mongodb.uri=mongodb://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:27017
spring.mongodb.database=${DATABASE_NAME}
spring.mongodb.representation.uuid=standard

# Configuração do usuário root inicial
security.user.username=${ADMIN_USERNAME}
security.user.password=${ADMIN_PASSWORD}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG